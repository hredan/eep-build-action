name: Python Tests

on:
  push:
    branches:
      - main
      - switch-to-python
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pylint
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run pylint
        run: python -m pylint --max-line-length=120 py_modules/ tests/ build_sketch.py